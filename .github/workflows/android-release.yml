name: Android signed release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix web ci

      - name: Verify tag and release metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const expected = process.env.RELEASE_TAG.replace(/^v/, '');
          const root = require('./package.json');
          const web = require('./web/package.json');
          const gradle = fs.readFileSync('web/android/app/build.gradle', 'utf8');
          if (root.version !== expected || web.version !== expected) {
            throw new Error(`Version mismatch: tag=${expected}, root=${root.version}, web=${web.version}`);
          }
          if (!gradle.includes('versionCode 50007') || !gradle.includes(`versionName "${expected}"`)) {
            throw new Error('Android release metadata does not match v5.0.7.');
          }
          NODE

      - name: Restore and validate Firebase Android configuration
        shell: bash
        env:
          ANDROID_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" || { echo 'Required Firebase Android secret is not configured: ANDROID_GOOGLE_SERVICES_JSON_BASE64'; exit 1; }
          umask 077
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > web/android/app/google-services.json
          test -s web/android/app/google-services.json || { echo 'Decoded google-services.json is empty.'; exit 1; }
          node <<'NODE'
          const config = require('./web/android/app/google-services.json');
          const expectedPackage = 'com.laboratory.managementsystem';
          const clients = Array.isArray(config.client) ? config.client : [];
          const matchesPackage = clients.some((entry) =>
            entry?.client_info?.android_client_info?.package_name === expectedPackage
          );
          if (!config?.project_info?.project_id || !matchesPackage) {
            throw new Error('Firebase Android configuration does not match the release application.');
          }
          console.log('Firebase Android configuration validated.');
          NODE

      - name: Restore release signing material
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          for required in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            test -n "${!required}" || { echo "Required Android release signing secret is not configured: $required"; exit 1; }
          done
          umask 077
          key_store="$RUNNER_TEMP/laboratory-management-system-release.jks"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$key_store"
          test -s "$key_store" || { echo 'Decoded Android release keystore is empty.'; exit 1; }
          {
            echo "ANDROID_RELEASE_STORE_FILE=$key_store"
            echo "ANDROID_RELEASE_STORE_PASSWORD=$ANDROID_RELEASE_STORE_PASSWORD"
            echo "ANDROID_RELEASE_KEY_ALIAS=$ANDROID_RELEASE_KEY_ALIAS"
            echo "ANDROID_RELEASE_KEY_PASSWORD=$ANDROID_RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        run: |
          npm --prefix web run build:android
          cd web
          npx cap sync android
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Verify production APK signature
        shell: bash
        env:
          EXPECTED_CERT_SHA256: f0eda9a14e2d4aaf6b7c0c9613dd0186f2a9beaf3a5e96c3683f450489d185dc
        run: |
          apk='web/android/app/build/outputs/apk/release/app-release.apk'
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner" || { echo 'Android apksigner was not found.'; exit 1; }
          "$apksigner" verify --verbose "$apk"
          cert_output="$("$apksigner" verify --print-certs "$apk")"
          grep -qiF -- "$EXPECTED_CERT_SHA256" <<<"$cert_output" || { echo 'APK signer certificate does not match the official production certificate.'; exit 1; }
          echo 'Production APK signature verified.'

      - name: Prepare versioned release assets
        shell: bash
        run: |
          mkdir -p release-dist
          cp web/android/app/build/outputs/apk/release/app-release.apk "release-dist/Laboratory-Management-System-${GITHUB_REF_NAME}.apk"
          cp web/android/app/build/outputs/bundle/release/app-release.aab "release-dist/Laboratory-Management-System-${GITHUB_REF_NAME}.aab"
          cd release-dist
          sha256sum "Laboratory-Management-System-${GITHUB_REF_NAME}.apk" "Laboratory-Management-System-${GITHUB_REF_NAME}.aab" > "SHA256SUMS-${GITHUB_REF_NAME}.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.ref_name }}
          path: release-dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: IDBS ${{ github.ref_name }}
          body_path: docs/RELEASE-${{ github.ref_name }}.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-dist/*
