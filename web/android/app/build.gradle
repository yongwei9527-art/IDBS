import java.util.Properties
import java.util.Locale

// Release credentials are intentionally external to the repository. CI values take precedence
// over the ignored local keystore.properties file.
def releaseKeystoreProperties = new Properties()
def releaseKeystorePropertiesFile = rootProject.file('keystore.properties')
if (releaseKeystorePropertiesFile.exists()) {
    releaseKeystorePropertiesFile.withInputStream { stream ->
        releaseKeystoreProperties.load(stream)
    }
}

def releaseSigningValue = { String environmentKey, String propertyKey ->
    def environmentValue = System.getenv(environmentKey)
    if (environmentValue != null && !environmentValue.trim().isEmpty()) {
        return environmentValue.trim()
    }
    def propertyValue = releaseKeystoreProperties.getProperty(propertyKey)
    return propertyValue != null && !propertyValue.trim().isEmpty() ? propertyValue.trim() : null
}

def releaseSigning = [
    storeFile: releaseSigningValue('ANDROID_RELEASE_STORE_FILE', 'RELEASE_STORE_FILE'),
    storePassword: releaseSigningValue('ANDROID_RELEASE_STORE_PASSWORD', 'RELEASE_STORE_PASSWORD'),
    keyAlias: releaseSigningValue('ANDROID_RELEASE_KEY_ALIAS', 'RELEASE_KEY_ALIAS'),
    keyPassword: releaseSigningValue('ANDROID_RELEASE_KEY_PASSWORD', 'RELEASE_KEY_PASSWORD')
]
def missingReleaseSigningFields = releaseSigning.findAll { key, value -> value == null }.keySet()
def releaseSigningConfigured = missingReleaseSigningFields.isEmpty()
def releaseStoreFile = releaseSigningConfigured ? rootProject.file(releaseSigning.storeFile) : null

def appLinkValue = { String environmentKey, String propertyKey ->
    def value = System.getenv(environmentKey)
    if (value == null || value.trim().isEmpty()) value = project.findProperty(propertyKey)
    return value == null ? '' : value.toString().trim()
}
def appLinkHost = appLinkValue('ANDROID_APP_LINK_HOST', 'LAB_APP_LINK_HOST').toLowerCase(Locale.ROOT)
def appLinkAutoVerify = appLinkValue('ANDROID_APP_LINK_AUTO_VERIFY', 'LAB_APP_LINK_AUTO_VERIFY') ?: 'false'
def appLinkLabels = appLinkHost ? appLinkHost.split(/[.]/, -1) : []
def validAppLinkHost = !appLinkHost || (appLinkHost.length() <= 253 && appLinkLabels.size() >= 2
    && appLinkLabels.every { label ->
        label.length() <= 63 && label ==~ /(?i)^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/
    })
if (!validAppLinkHost) {
    throw new GradleException(
        'ANDROID_APP_LINK_HOST / LAB_APP_LINK_HOST must be a DNS hostname without scheme, path or port (received: '
            + appLinkHost + ').'
    )
}
if (!(appLinkAutoVerify in ['true', 'false'])) {
    throw new GradleException('ANDROID_APP_LINK_AUTO_VERIFY / LAB_APP_LINK_AUTO_VERIFY must be true or false.')
}
if (appLinkAutoVerify == 'true' && !appLinkHost) {
    throw new GradleException('An App Link host is required when autoVerify is enabled.')
}

if (releaseSigningConfigured && !releaseStoreFile.isFile()) {
    throw new GradleException('The configured Android release keystore file cannot be found.')
}

apply plugin: 'com.android.application'

android {
    namespace = "com.laboratory.managementsystem"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.laboratory.managementsystem"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 50008
        versionName "5.0.8"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        manifestPlaceholders = [
            labAppLinkHost: appLinkHost ?: 'app.invalid',
            labAppLinkAutoVerify: appLinkAutoVerify
        ]
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile releaseStoreFile
                storePassword releaseSigning.storePassword
                keyAlias releaseSigning.keyAlias
                keyPassword releaseSigning.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


gradle.taskGraph.whenReady { graph ->
    def releaseTaskRequested = graph.allTasks.any { task -> task.name.toLowerCase().contains('release') }
    if (releaseTaskRequested && !releaseSigningConfigured) {
        throw new GradleException(
            'Android release signing is not configured. Configure the ignored web/android/keystore.properties file or CI environment variables. Missing fields: ' + missingReleaseSigningFields.join(', ')
        )
    }
}
